*list:DESCRIPTION
	Just another day for Myrah Werrington, daughter of Jake and her best friend Francis Frankenstein... or is it?
	Things make a very strange turn when the two girls discover a girl sealed in a huge crystal.
	The girl appears to suffer from amnesia.
	All she knows is that people used to calle her "Luna" and that she has to look for... her father
*end
